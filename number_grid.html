!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid number layout</title>
    <style>
        .container{
            display:grid;
            border: 1px solid green;
            grid-row: 25%25%25%25%;
            grid-column: 25%25%25%25%;
            gap: 1px;

        }
        .header{
            background-color: orangered;
            height: 25vh;
            grid-row: 1/2;
            grid-column: 1/5;

        }
        .sb1{
            background-color: rgb(9,57,77);
            height: 25vh;
            grid-row: 2/3;
            grid-column: 1/5;

        }
        .sb2{
            background-color: rgb(81,11,88);
            height: 25vh;
            grid-row: 2/3;
            grid-column: 2/3;
        }
        .sb3{
            background-color: rgb(68,136,13);
            height: 25vh;
            grid-row: 2/3;
            grid-column: 3/4;
        }
        .sb{
            background-color: rgb(117,9,47);
            height: 50vh;
            grid-row: 2/4;
            grid-column: 4/5;
        }
        .main{
            background-color: rgb(216,102,36);
            height: 25vh;
            grid-row: 3/4;
            grid-column: 1/4;
        }
        .footer{
            background-color: rgba(5, 219, 243, 0.449);
            height: 25vh;
            grid-row: 4/5;
            grid-column: 1/5;
        } 
        
    </style>
    
</head>
<body>
    <div class="container">
    <div class="header">Header element
         <span>home</span>
         <span>about</span>
         <span>login</span>
    </div>
    <div class="sb1">small box1 </div>
    <div class="sb2">small box2</div>
    <div class="sb3">small box3</div> 
    <div class="sb">side bar </div>
    <div class="main">main content</div>
    <div class="footer">footer part</div>
    </div>       
</body>
</html>
